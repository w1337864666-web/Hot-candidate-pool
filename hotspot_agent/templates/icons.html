{% macro icon(name, class_name="icon", size=20) -%}
<svg class="{{ class_name }}" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
  {% if name == "logo" %}
  <path d="m13 2-9 11h8l-1 9 9-12h-8z"/>
  {% elif name == "sidebar" %}
  <rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/>
  {% elif name == "all" %}
  <rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/>
  {% elif name == "pending" %}
  <path d="M4 4h16v16H4z"/><path d="M4 13h4l2 3h4l2-3h4"/>
  {% elif name == "approved" or name == "final" %}
  <path d="M22 11.1V12a10 10 0 1 1-5.9-9.1"/><path d="m9 11 3 3L22 4"/>
  {% elif name == "edited" %}
  <path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/>
  {% elif name == "rejected" or name == "ai_filtered" %}
  <circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/>
  {% elif name == "deleted" or name == "trash" %}
  <path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v5"/><path d="M14 11v5"/>
  {% elif name == "runs" or name == "activity" %}
  <path d="M3 12h4l3-9 4 18 3-9h4"/>
  {% elif name == "review" %}
  <rect width="14" height="18" x="5" y="3" rx="2"/><path d="M9 3v2h6V3"/><path d="m9 13 2 2 4-4"/>
  {% elif name == "arrow-right" %}
  <path d="M5 12h14"/><path d="m13 6 6 6-6 6"/>
  {% elif name == "back" %}
  <path d="m15 18-6-6 6-6"/>
  {% elif name == "scan" %}
  <path d="m5 3 14 9-14 9z"/>
  {% elif name == "settings" %}
  <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>
  {% elif name == "chevron-down" %}
  <path d="m6 9 6 6 6-6"/>
  {% elif name == "external" %}
  <path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
  {% elif name == "restore" %}
  <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>
  {% elif name == "eye" %}
  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12"/><circle cx="12" cy="12" r="3"/>
  {% elif name == "warning" %}
  <path d="m21.7 18-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>
  {% elif name == "shield" %}
  <path d="M20 13c0 5-3.5 7.5-8 9-4.5-1.5-8-4-8-9V5l8-3 8 3z"/><path d="m9 12 2 2 4-4"/>
  {% elif name == "sparkles" %}
  <path d="m12 3-1.5 3.5L7 8l3.5 1.5L12 13l1.5-3.5L17 8l-3.5-1.5Z"/><path d="m5 14-.8 1.8L2.5 17l1.7.8L5 20l.8-2.2 1.7-.8-1.7-1.2Z"/><path d="m19 14-.8 1.8-1.7 1.2 1.7.8L19 20l.8-2.2 1.7-.8-1.7-1.2Z"/>
  {% elif name == "clock" %}
  <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
  {% elif name == "menu" %}
  <path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/>
  {% elif name == "close" %}
  <path d="m6 6 12 12"/><path d="m18 6-12 12"/>
  {% else %}
  <circle cx="12" cy="12" r="9"/><path d="M12 8v4"/><path d="M12 16h.01"/>
  {% endif %}
</svg>
{%- endmacro %}
